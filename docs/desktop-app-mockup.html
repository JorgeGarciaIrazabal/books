  // Split Reference Pane
  function renderSplitPane() {
    const pane = $("splitPane");
    pane.hidden = !state.splitRefOpen;
    if (pane.hidden) return;
    const b = currentBook();
    const sel = $("splitRefSelect");
    const options = [
      ...b.characters.map((c) => ({ key: c.id, label: `Character: ${c.name}` })),
      ...b.canon.map((f) => ({ key: f.id, label: `Canon: ${f.title}` })),
      { key: "BRIEF", label: "Book Brief & Constraints" }
    ];
    sel.innerHTML = options.map((o) => `<option value="${o.key}" ${o.key === state.splitRefKey ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("");
    sel.onchange = (e) => { state.splitRefKey = e.target.value; renderSplitPane(); };

    const body = $("splitPaneBody");
    const char = b.characters.find((c) => c.id === state.splitRefKey);
    const fact = b.canon.find((f) => f.id === state.splitRefKey);
    if (char) {
      body.innerHTML = `
        <span class="pill">${char.id}</span>
        <h3 style="font-family:var(--serif);margin:6px 0 4px;">${escapeHtml(char.name)}</h3>
        <div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:10px;">${escapeHtml(char.title)}</div>
        <p><strong>Role:</strong> ${escapeHtml(char.role)}</p>
        <p><strong>Want:</strong> ${escapeHtml(char.want)}</p>
        <p><strong>Voice:</strong> ${escapeHtml(char.voice)}</p>
        <div class="card-quote">${escapeHtml(char.sampleLine)}</div>`;
    } else if (fact) {
      body.innerHTML = `
        <span class="pill">${fact.id}</span> <span class="pill pill-sage">${fact.status}</span>
        <h3 style="font-family:var(--serif);margin:8px 0 6px;">${escapeHtml(fact.title)}</h3>
        <p>${escapeHtml(fact.text)}</p>`;
    } else {
      body.innerHTML = `
        <h3 style="font-family:var(--serif);margin:0 0 8px;">Brief & Constraints</h3>
        <p>${escapeHtml(b.brief.promise)}</p>
        <p><strong>Constraints:</strong> ${escapeHtml(b.brief.constraints)}</p>`;
    }
  }

  // Right Companion Rail
  function renderRail() {
    document.querySelectorAll(".rail-tab").forEach((t) => {
      t.classList.toggle("is-active", t.dataset.rail === state.railTab);
    });
    const body = $("railBody");
    const b = currentBook();
    const ch = currentChapter();

    if (state.railTab === "comments") {
      const viewCmts = b.comments.filter((c) => {
        if (state.cmtScope === "all") return true;
        if (state.view === "canon") return c.targetKind === "canon";
        if (state.view === "chapter") return c.targetKind !== "canon" && c.chapterId === ch.id;
        return true;
      });
      const filtered = viewCmts.filter((c) => state.cmtFilter === "all" || c.status === state.cmtFilter);

      let anchorHintHtml = "";
      if (state.draftAnchor && state.draftAnchor.kind === "canon") {
        anchorHintHtml = `<div class="anchor-meta" style="color:var(--accent);">Anchored to Canon · ${escapeHtml(state.draftAnchor.recordId)} (${escapeHtml(state.draftAnchor.recordTitle)})</div>`;
      } else if (state.draftAnchor && state.draftAnchor.paragraphId) {
        const stats = getAnchorLocationStats(ch, state.draftAnchor);
        const dupInfo = stats.total > 1 ? ` · occurrence #${stats.occ} of ${stats.total}` : "";
        anchorHintHtml = `<div class="anchor-meta" style="color:var(--sage);">Anchored to ¶${stats.pNum} · chars ${state.draftAnchor.startOffset}–${state.draftAnchor.endOffset}${dupInfo}</div>`;
      }

      const composerHtml = `
        <div class="composer">
          <div style="font-size:11.5px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;">
            <span>New Anchored Comment</span>
            <span style="color:var(--muted);font-weight:400;">reviews/comments.json</span>
          </div>
          <input type="text" id="newCmtQuote" value="${escapeHtml(state.draftAnchor ? state.draftAnchor.quote : "")}" placeholder="Highlight prose or click + Comment on a Canon rule...">
          ${anchorHintHtml}
          <div class="composer-row">
            <select id="newCmtRole">
              <option value="@line_editor">@line_editor</option>
              <option value="@canon_keeper">@canon_keeper</option>
              <option value="@character_director">@character_director</option>
              <option value="@drafter">@drafter</option>
              <option value="@reader_advocate">@reader_advocate</option>
            </select>
            <select id="newCmtIntent">
              <option value="revise">revise</option>
              <option value="check-canon">check-canon</option>
              <option value="critique">critique</option>
            </select>
          </div>
          <textarea id="newCmtBody" rows="2" placeholder="Note for Antigravity's address-comments skill..."></textarea>
          <button type="button" class="btn btn-primary btn-sm" style="width:100%;justify-content:center;" id="addCmtSubmit">Anchor Comment</button>
        </div>`;

      const scopeHtml = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;">
          <div class="seg" style="width:100%;display:grid;grid-template-columns:1fr 1fr;">
            <button type="button" data-cscope="all" class="${state.cmtScope === "all" ? "is-active" : ""}">All (Book + Canon)</button>
            <button type="button" data-cscope="view" class="${state.cmtScope === "view" ? "is-active" : ""}">This View Only</button>
          </div>
        </div>`;

      const filtersHtml = `
        <div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;">
          ${[["all","All"],["open","Open"],["needs-review","Needs Review"],["resolved","Resolved"]].map(([k, lbl]) =>
            `<button type="button" class="btn btn-sm ${state.cmtFilter === k ? "is-active" : ""}" data-cf="${k}">${lbl}</button>`
          ).join("")}
        </div>`;

      const listHtml = filtered.map((c) => {
        let metaLine = "";
        if (c.targetKind === "canon") {
          metaLine = `<span class="pill pill-role" style="font-family:var(--sans);">Canon · ${escapeHtml(c.recordId)}</span> <span>${escapeHtml(c.recordTitle || "")}</span>`;
        } else {
          const targetCh = b.chapters.find((x) => x.id === c.chapterId) || ch;
          const stats = getAnchorLocationStats(targetCh, c.anchor);
          const dupBadge = stats.total > 1 ? ` · #${stats.occ} of ${stats.total}` : "";
          metaLine = `<span>¶${stats.pNum} · chars ${c.anchor.startOffset}–${c.anchor.endOffset}${dupBadge}</span>`;
        }
        return `
        <div class="card ${state.activeCmtId === c.id ? "is-highlighted" : ""}" data-card-cmt="${c.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px;">
            <div style="display:flex;gap:4px;align-items:center;">
              <span class="pill pill-role">${escapeHtml(c.role)}</span>
              <span class="pill">${escapeHtml(c.intent)}</span>
            </div>
            <span class="pill ${c.status === "resolved" ? "pill-sage" : c.status === "needs-review" ? "pill-gold" : ""}">${c.status}</span>
          </div>
          <div class="anchor-meta">
            ${metaLine}
            ${c.anchor.autoUpdated ? `<span class="pill pill-writer">Anchor auto-updated</span>` : ""}
            ${c.anchor.orphaned ? `<span class="pill pill-rose">Passage deleted</span>` : ""}
          </div>
          ${c.anchor.quote ? `<div class="card-quote">"${escapeHtml(c.anchor.quote)}"</div>` : `<div class="card-quote" style="border-left-color:var(--rose);">Original: "${escapeHtml(c.anchor.originalQuote)}"</div>`}
          <div style="font-size:12.5px;line-height:1.45;margin-bottom:8px;">${escapeHtml(c.authorNote)}</div>
          ${c.agentReply ? `<div class="agent-reply-box"><strong>${escapeHtml(c.role)}:</strong> ${escapeHtml(c.agentReply)}</div>` : ""}
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
            ${c.status !== "resolved" ? `<button type="button" class="btn btn-sm" data-resolve-cmt="${c.id}">Resolve</button>` : ""}
            <span style="font-size:11px;color:var(--muted);margin-left:auto;align-self:center;">${c.createdAt}</span>
          </div>
        </div>`;
      }).join("") || `<div class="card" style="color:var(--muted);text-align:center;">No comments in this filter.</div>`;

      body.innerHTML = composerHtml + scopeHtml + filtersHtml + listHtml;

      $("addCmtSubmit").onclick = () => {
        const note = $("newCmtBody").value.trim();
        if (!note) { showToast("Write a comment first"); return; }
        const quote = $("newCmtQuote").value.trim();
        const id = `CMT-000${b.comments.length + 1}`;
        if (state.draftAnchor && state.draftAnchor.kind === "canon") {
          b.comments.unshift({
            id,
            targetKind: "canon",
            recordId: state.draftAnchor.recordId,
            recordTitle: state.draftAnchor.recordTitle,
            anchor: { quote: quote || state.draftAnchor.quote, originalQuote: quote || state.draftAnchor.quote },
            role: $("newCmtRole").value,
            intent: $("newCmtIntent").value,
            status: "open",
            authorNote: note,
            agentReply: null,
            createdAt: "Just now"
          });
        } else {
          let anchor = state.draftAnchor;
          if (!anchor || anchor.quote !== quote) {
            const matchP = ch.paragraphs.find((p) => quote && p.text.includes(quote)) || ch.paragraphs[0];
            const s = quote && matchP ? Math.max(0, matchP.text.indexOf(quote)) : 0;
            const e = quote ? s + quote.length : 0;
            anchor = {
              paragraphId: matchP ? matchP.id : null,
              startOffset: s,
              endOffset: e,
              quote,
              originalQuote: quote,
              prefix: matchP ? matchP.text.slice(Math.max(0, s - 32), s) : "",
              suffix: matchP ? matchP.text.slice(e, Math.min(matchP.text.length, e + 32)) : "",
              autoUpdated: false,
              orphaned: false
            };
          }
          b.comments.unshift({
            id,
            targetKind: "chapter",
            chapterId: ch.id,
            anchor: {
              paragraphId: anchor.paragraphId,
              startOffset: anchor.startOffset,
              endOffset: anchor.endOffset,
              quote: anchor.quote,
              originalQuote: anchor.quote,
              prefix: anchor.prefix || "",
              suffix: anchor.suffix || "",
              autoUpdated: false,
              orphaned: false
            },
            role: $("newCmtRole").value,
            intent: $("newCmtIntent").value,
            status: "open",
            authorNote: note,
            agentReply: null,
            createdAt: "Just now"
          });
        }
        state.draftAnchor = null;
        state.activeCmtId = id;
        b.githubSync.ahead += 1;
        pulseSync("Live Sync · Saved reviews/comments.json", "ok");
        showToast(`Anchored ${id} in reviews/comments.json`);
        renderAll();
      };

      body.querySelectorAll("[data-cscope]").forEach((btn) => {
        btn.onclick = () => { state.cmtScope = btn.dataset.cscope; renderRail(); };
      });
      body.querySelectorAll("[data-cf]").forEach((btn) => {
        btn.onclick = () => { state.cmtFilter = btn.dataset.cf; renderRail(); };
      });
      body.querySelectorAll("[data-card-cmt]").forEach((card) => {
        card.onclick = () => {
          state.activeCmtId = card.dataset.cardCmt;
          const target = b.comments.find((x) => x.id === state.activeCmtId);
          if (target && target.targetKind === "canon") {
            state.view = "canon";
            renderAll();
            const cCard = document.querySelector(`[data-canon-card="${target.recordId}"]`);
            if (cCard) cCard.scrollIntoView({ behavior: "smooth", block: "center" });
          } else {
            if (target && target.chapterId) state.chapterId = target.chapterId;
            state.view = "chapter";
            state.diffMode = "clean";
            renderAll();
            const m = document.querySelector(`[data-cmt-id="${state.activeCmtId}"]`);
            if (m) m.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        };
      });
      body.querySelectorAll("[data-resolve-cmt]").forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const c = b.comments.find((x) => x.id === btn.dataset.resolveCmt);
          if (c) c.status = "resolved";
          b.githubSync.ahead += 1;
          pulseSync("Live Sync · Updated comments.json", "ok");
          renderAll();
        };
      });
      return;
    }

    if (state.railTab === "history") {
      const base = getBaselineVersion(ch);
      const versHtml = ch.versions.map((v, idx) => `
        <div class="card ${base && base.id === v.id ? "is-highlighted" : ""}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <strong>${v.id}</strong>
              <span class="pill ${v.role === "agent" ? "pill-sage" : "pill-writer"}">${escapeHtml(v.author)}</span>
              ${idx === 0 ? `<span class="pill pill-gold">Latest</span>` : ""}
            </div>
            <span style="font-size:11px;color:var(--muted);">${v.time}</span>
          </div>
          <div style="font-size:12.5px;margin-bottom:5px;">${escapeHtml(v.summary)}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Delta: ${escapeHtml(v.delta)}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button type="button" class="btn btn-sm" data-cmp-inline="${v.id}">Compare Inline</button>
            <button type="button" class="btn btn-sm" data-cmp-sbs="${v.id}">Side-by-Side</button>
            ${idx > 0 && v.paragraphs ? `<button type="button" class="btn btn-sm btn-primary" data-restore-ver="${v.id}">Restore</button>` : ""}
          </div>
        </div>`).join("");

      body.innerHTML = `
        <div class="card" style="background:var(--panel-alt);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <strong style="font-size:12.5px;">Chapter Version Timeline</strong>
            <button type="button" class="btn btn-sm btn-primary" id="railSaveVerBtn">+ Save Version</button>
          </div>
          <div style="font-size:11.5px;color:var(--muted);line-height:1.45;">
            Automatic snapshots capture every writer milestone and external Antigravity update. Restoring always creates a new latest version.
          </div>
        </div>
        ${versHtml}`;

      $("railSaveVerBtn").onclick = openSaveVersionModal;
      body.querySelectorAll("[data-cmp-inline]").forEach((btn) => {
        btn.onclick = () => { state.view = "chapter"; state.baselineVersionId = btn.dataset.cmpInline; state.diffMode = "inline"; renderAll(); };
      });
      body.querySelectorAll("[data-cmp-sbs]").forEach((btn) => {
        btn.onclick = () => { state.view = "chapter"; state.baselineVersionId = btn.dataset.cmpSbs; state.diffMode = "sidebyside"; renderAll(); };
      });
      body.querySelectorAll("[data-restore-ver]").forEach((btn) => {
        btn.onclick = () => {
          const ver = ch.versions.find((v) => v.id === btn.dataset.restoreVer);
          if (!ver || !ver.paragraphs) return;
          const nextNum = ch.versions[0].num + 1;
          ch.paragraphs = ver.paragraphs.map((p) => ({ id: p.id, text: p.text }));
          ch.versions.unshift({
            id: "v" + nextNum,
            num: nextNum,
            author: "You",
            role: "writer",
            time: "Just now",
            summary: `Restored from ${ver.id} (${ver.author})`,
            delta: "non-destructive restore",
            paragraphs: ch.paragraphs.map((p) => ({ id: p.id, text: p.text }))
          });
          ch.dirtyExternal = false;
          ch.dirtyWriter = false;
          state.baselineVersionId = ver.id;
          state.diffMode = "clean";
          pulseSync(`Live Sync · Restored ${ver.id} as v${nextNum}`, "ok");
          showToast(`Created v${nextNum} from ${ver.id} without losing earlier drafts`);
          renderAll();
        };
      });
      return;
    }

    if (state.railTab === "context") {
      const hints = Object.entries(b.entityHints).map(([term, info]) => `
        <div class="card">
          <div style="font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;">${escapeHtml(info.type)}</div>
          <div style="font-weight:700;margin:3px 0;">${escapeHtml(term)}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">${escapeHtml(info.blurb)}</div>
          <button type="button" class="btn btn-sm" data-ctx-pin="${info.targetId}">Pin in Split Ref</button>
        </div>`).join("");
      body.innerHTML = `
        <div class="card" style="background:var(--panel-alt);">
          <strong style="font-size:12.5px;">Auto-Detected Story Context</strong>
          <div style="font-size:11.5px;color:var(--muted);margin-top:3px;">Entities & world rules referenced in ${escapeHtml(ch.label)}.</div>
        </div>
        ${hints}`;
      body.querySelectorAll("[data-ctx-pin]").forEach((btn) => {
        btn.onclick = () => { state.splitRefOpen = true; state.splitRefKey = btn.dataset.ctxPin; renderAll(); };
      });
      return;
    }

    // Sync & GitHub Push/Pull + Antigravity Skill Tab
    const gs = b.githubSync;
    const runsHtml = b.syncEvents.map((r) => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span class="pill pill-sage">${escapeHtml(r.source)}</span>
          <span style="font-size:11px;color:var(--muted);">${r.time}</span>
        </div>
        <div style="font-size:12.5px;line-height:1.45;">${escapeHtml(r.summary)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:5px;">Snapshot: ${escapeHtml(r.snapshot)}</div>
      </div>`).join("");

    body.innerHTML = `
      <div class="card" style="background:var(--panel-alt);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <strong style="font-size:12.5px;">GitHub Sync (<code>tools/studio_sync.py</code>)</strong>
          <span class="pill ${gs.ahead || gs.behind ? "pill-gold" : "pill-sage"}">↑${gs.ahead} ↓${gs.behind}</span>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;">
          Branch: <code>${escapeHtml(gs.remote)}</code> · Last synced: <strong>${escapeHtml(gs.lastSynced)}</strong>
        </div>
        <div class="composer-row" style="margin-bottom:7px;">
          <select id="ghIntervalSel" class="baseline-select" style="flex:1;" aria-label="Auto-sync frequency">
            <option value="1m" ${gs.interval === "1m" ? "selected" : ""}>Auto-sync: Every 1 min</option>
            <option value="2m" ${gs.interval === "2m" ? "selected" : ""}>Auto-sync: Every 2 min</option>
            <option value="5m" ${gs.interval === "5m" ? "selected" : ""}>Auto-sync: Every 5 min</option>
            <option value="manual" ${gs.interval === "manual" ? "selected" : ""}>Auto-sync: Manual only</option>
          </select>
        </div>
        <div style="margin-bottom:9px;">
          <select id="ghPrivacySel" class="baseline-select" style="width:100%;" aria-label="Remote privacy mode">
            <option value="private-auto" ${gs.privacyMode === "private-auto" ? "selected" : ""}>Private draft branch (Auto Push + Pull)</option>
            <option value="public-manual" ${gs.privacyMode === "public-manual" ? "selected" : ""}>Public catalog origin (Auto Pull · Manual Push)</option>
          </select>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button type="button" class="btn btn-sm btn-primary" style="flex:1;justify-content:center;" id="ghPullPushBtn">Pull &amp; Push Now</button>
          <button type="button" class="btn btn-sm" id="ghSimPullBtn">Simulate Remote Pull</button>
        </div>
      </div>

      <div class="card" style="background:var(--panel-alt);">
        <strong style="font-size:12.5px;">Antigravity Skill Handoff</strong>
        <div style="font-size:11.5px;color:var(--muted);margin:4px 0 10px;line-height:1.45;">
          Manuscript &amp; canon comments save to <code>reviews/comments.json</code>. Address them from Antigravity using <code>address-comments</code>—this app live-syncs disk writes and projects anchors automatically.
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button type="button" class="btn btn-sm btn-primary" id="syncCopyPromptBtn">Copy Prompt for Antigravity</button>
          <button type="button" class="btn btn-sm btn-sage" id="syncSimExtBtn">Simulate External Antigravity Edit</button>
        </div>
      </div>
      ${runsHtml}`;

    $("ghIntervalSel").onchange = (e) => {
      gs.interval = e.target.value;
      showToast(`GitHub auto-sync set to ${gs.interval}`);
    };
    $("ghPrivacySel").onchange = (e) => {
      gs.privacyMode = e.target.value;
      showToast(gs.privacyMode === "public-manual" ? "Public origin guard: auto-pull only, manual push" : "Private branch: frequent auto pull + push enabled");
    };
    $("ghPullPushBtn").onclick = pullAndPushGitHub;
    $("ghSimPullBtn").onclick = simulateRemotePull;
    $("syncCopyPromptBtn").onclick = copyPromptForAntigravity;
    $("syncSimExtBtn").onclick = simulateExternalSync;
  }

  function pullAndPushGitHub() {
    const b = currentBook();
    const gs = b.githubSync;
    pulseSync("studio_sync.py refresh → save → share…", "saving");
    setTimeout(() => {
      const pushed = gs.ahead;
      const pulled = gs.behind;
      gs.ahead = 0;
      gs.behind = 0;
      gs.lastSynced = "Just now";
      b.syncEvents.unshift({
        id: `SYNC-${b.syncEvents.length + 20}`,
        source: "GitHub Sync",
        time: "Just now",
        summary: `studio_sync.py completed (pulled ${pulled}, pushed ${pushed} scoped change${pushed === 1 ? "" : "s"}) on ${gs.remote}.`,
        snapshot: "HEAD synced"
      });
      pulseSync("Synced · GitHub ↑0 ↓0 · Just now", "external");
      showToast("Pulled & pushed cleanly to GitHub via studio_sync.py");
      renderAll();
    }, 450);
  }

  function simulateRemotePull() {
    const b = currentBook();
    const gs = b.githubSync;
    gs.behind += 1;
    pulseSync("Auto-pulling remote commit from GitHub…", "saving");
    setTimeout(() => {
      gs.behind = 0;
      gs.lastSynced = "Just now";
      b.syncEvents.unshift({
        id: `SYNC-${b.syncEvents.length + 21}`,
        source: "GitHub Auto-Pull",
        time: "Just now",
        summary: "Fast-forwarded 1 remote commit from another workstation via studio_sync.py refresh.",
        snapshot: "remote HEAD"
      });
      pulseSync("Pulled remote update · GitHub ↑" + gs.ahead + " ↓0", "external");
      showToast("Pulled incoming commit from GitHub automatically");
      renderAll();
    }, 450);
  }

  function copyPromptForAntigravity() {
    const b = currentBook();
    const open = b.comments.filter((c) => c.status === "open");
    const msCount = open.filter((c) => c.targetKind !== "canon").length;
    const canonCount = open.filter((c) => c.targetKind === "canon").length;
    const ids = open.map((c) => c.id).join(", ") || "none";
    const prompt = `Use the address-comments skill on ${b.id} (${b.title}) to address open comments in reviews/comments.json (${msCount} manuscript, ${canonCount} canon): ${ids}.`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).catch(() => {});
    }
    showToast(`Copied Antigravity prompt (${msCount} manuscript, ${canonCount} canon open)`);
  }

  // Simulate Antigravity writing externally to disk (including rewriting a commented span!)
  function simulateExternalSync() {
    const b = currentBook();
    const ch = currentChapter();
    if (!ch) return;
    state.view = "chapter";

    // Target a paragraph that has an active comment so user sees Tier 3 diff-projected anchor survival!
    const targetP = ch.paragraphs.find((p) => p.id === "p-001-12") || ch.paragraphs[0];
    if (!targetP) return;

    pulseSync("Watcher detected external disk write…", "saving");
    setTimeout(() => {
      const oldText = targetP.text;
      let newText;
      if (oldText.includes("I don't recall anyone saying")) {
        newText = oldText.replace("I don't recall anyone saying", "I have no memory of anyone saying");
      } else {
        newText = oldText + " (Refined externally via Antigravity.)";
      }

      // Project any anchored comments in this paragraph through the diff!
      b.comments.filter((c) => c.targetKind !== "canon" && c.chapterId === ch.id && c.anchor.paragraphId === targetP.id).forEach((c) => {
        const proj = projectRangeThroughDiff(oldText, newText, c.anchor.startOffset, c.anchor.endOffset);
        c.anchor.startOffset = proj.start;
        c.anchor.endOffset = proj.end;
        c.anchor.quote = proj.quote;
        c.anchor.prefix = newText.slice(Math.max(0, proj.start - 36), proj.start);
        c.anchor.suffix = newText.slice(proj.end, Math.min(newText.length, proj.end + 36));
        c.anchor.autoUpdated = true;
        c.anchor.orphaned = proj.orphaned;
        c.status = "needs-review";
        c.agentReply = "Updated phrasing per comment; anchor automatically projected to new text.";
      });

      targetP.text = newText;
      targetP.externalEdit = { agent: "Antigravity (@line_editor)", oldText };
      ch.dirtyExternal = true;

      const nextNum = ch.versions[0].num + 1;
      ch.versions.unshift({
        id: "v" + nextNum,
        num: nextNum,
        author: "Antigravity (@line_editor)",
        role: "agent",
        time: "Just now",
        summary: "Addressed CMT-0001 via address-comments skill (anchor auto-projected)",
        delta: "+4 / -3 words",
        paragraphs: ch.paragraphs.map((p) => ({ id: p.id, text: p.text }))
      });

      ch.lastSyncBanner = `<strong>Antigravity (@line_editor)</strong> synced edits to <code>${escapeHtml(ch.file)}</code> · Saved <strong>v${nextNum}</strong> · Anchored comments auto-updated.`;
      b.syncEvents.unshift({
        id: `SYNC-${b.syncEvents.length + 13}`,
        source: "Antigravity (@line_editor)",
        time: "Just now",
        summary: `External write synced on ${ch.file}; projected comment anchors automatically.`,
        snapshot: `v${nextNum}`
      });

      state.diffMode = "clean"; // Keep clean default view, banner lets user inspect diff anytime
      pulseSync("External write synced · v" + nextNum, "external");
      showToast(`Live Sync applied Antigravity edit as v${nextNum} & updated comment anchor`);
      renderAll();
    }, 420);
  }

  // Save Named Version Modal
  function openSaveVersionModal() {
    $("verLabelInput").value = "";
    $("verGitCheck").checked = false;
    $("versionModal").hidden = false;
    $("verLabelInput").focus();
  }

  $("verCancelBtn").onclick = () => { $("versionModal").hidden = true; };
  $("verConfirmBtn").onclick = () => {
    const ch = currentChapter();
    const label = $("verLabelInput").value.trim() || "Writer milestone";
    const withGit = $("verGitCheck").checked;
    const nextNum = ch.versions[0].num + 1;
    ch.versions.unshift({
      id: "v" + nextNum,
      num: nextNum,
      author: "You",
      role: "writer",
      time: "Just now",
      summary: label + (withGit ? " (Git commit recorded)" : ""),
      delta: "snapshot",
      paragraphs: ch.paragraphs.map((p) => ({ id: p.id, text: p.text }))
    });
    ch.dirtyWriter = false;
    state.baselineVersionId = "v" + nextNum;
    $("versionModal").hidden = true;
    pulseSync(`Live Sync · Saved milestone v${nextNum}`, "ok");
    showToast(`Saved v${nextNum}: ${label}`);
    renderAll();
  };

  // Command Palette
  function getCmdItems(query) {
    const b = currentBook();
    const q = query.trim().toLowerCase();
    const items = [
      ...b.chapters.map((ch) => ({ kind: "Chapter", label: ch.label, sub: ch.file, act: () => { state.view = "chapter"; state.chapterId = ch.id; } })),
      ...b.characters.map((c) => ({ kind: "Character", label: `${c.name} — ${c.title}`, sub: c.id, act: () => { state.view = "characters"; state.selectedCharId = c.id; } })),
      ...b.canon.map((f) => ({ kind: "Canon", label: `${f.id}: ${f.title}`, sub: f.status, act: () => { state.view = "canon"; } })),
      { kind: "Action", label: "Show Clean Latest Version", sub: "View", act: () => { state.view = "chapter"; state.diffMode = "clean"; } },
      { kind: "Action", label: "Toggle Inline Diff (Writer & External Changes)", sub: "View", act: () => { state.view = "chapter"; state.diffMode = "inline"; } },
      { kind: "Action", label: "Toggle Side-by-Side Version Compare", sub: "View", act: () => { state.view = "chapter"; state.diffMode = "sidebyside"; } },
      { kind: "Action", label: "Open Version Timeline (History)", sub: "Iterate", act: () => { state.railTab = "history"; } },
      { kind: "Action", label: "Save Named Version Milestone", sub: "Iterate", act: () => { openSaveVersionModal(); } },
      { kind: "Action", label: "Toggle Focus Mode", sub: "Layout", act: () => { state.focusMode = !state.focusMode; } }
    ];
    return q ? items.filter((i) => (i.label + " " + i.kind + " " + i.sub).toLowerCase().includes(q)) : items;
  }

  function renderCmdResults() {
    const items = getCmdItems($("cmdInput").value);
    if (state.cmdSelectedIdx >= items.length) state.cmdSelectedIdx = 0;
    $("cmdResults").innerHTML = items.map((it, idx) => `
      <button type="button" class="cmd-item ${idx === state.cmdSelectedIdx ? "is-selected" : ""}" data-cmd-idx="${idx}">
        <span><strong>${escapeHtml(it.label)}</strong></span>
        <span class="pill">${escapeHtml(it.kind)}</span>
      </button>`).join("") || `<div style="padding:14px;color:var(--muted);text-align:center;">No matching records.</div>`;
    $("cmdResults").querySelectorAll("[data-cmd-idx]").forEach((btn) => {
      btn.onclick = () => {
        const chosen = items[Number(btn.dataset.cmdIdx)];
        if (chosen) { $("cmdModal").hidden = true; chosen.act(); renderAll(); }
      };
    });
  }

  // Exact DOM Offset Capture on Selection (fixes duplicate text!)
  document.addEventListener("mouseup", () => {
    setTimeout(() => {
      const sel = window.getSelection();
      const bar = $("selectionBar");
      if (!sel || sel.isCollapsed || state.view !== "chapter" || state.editorFormat !== "rich") {
        bar.hidden = true;
        return;
      }
      const prose = $("proseBody");
      if (!prose || !prose.contains(sel.anchorNode)) {
        bar.hidden = true;
        return;
      }
      const text = sel.toString().trim();
      if (text.length < 2) { bar.hidden = true; return; }

      const range = sel.getRangeAt(0);
      const startEl = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
      const pEl = startEl ? startEl.closest("[data-edit-pid]") : null;
      if (!pEl) { bar.hidden = true; return; }

      const preRange = document.createRange();
      preRange.selectNodeContents(pEl);
      preRange.setEnd(range.startContainer, range.startOffset);
      const startOffset = preRange.toString().length;
      const rawSel = sel.toString();
      const leadTrim = rawSel.length - rawSel.trimStart().length;
      const finalStart = startOffset + leadTrim;
      const finalEnd = finalStart + text.length;
      const pText = pEl.innerText.replace(/\n+$/, "");

      state._pendingSelectionAnchor = {
        paragraphId: pEl.dataset.editPid,
        startOffset: finalStart,
        endOffset: finalEnd,
        quote: text,
        prefix: pText.slice(Math.max(0, finalStart - 36), finalStart),
        suffix: pText.slice(finalEnd, Math.min(pText.length, finalEnd + 36))
      };

      const rect = range.getBoundingClientRect();
      bar.style.left = Math.max(12, Math.min(window.innerWidth - 320, rect.left)) + "px";
      bar.style.top = Math.max(52, rect.top - 42) + "px";
      bar.hidden = false;
    }, 10);
  });

  $("selBold").onclick = () => { document.execCommand("bold"); $("selectionBar").hidden = true; };
  $("selItalic").onclick = () => { document.execCommand("italic"); $("selectionBar").hidden = true; };
  $("selComment").onclick = () => {
    state.draftAnchor = state._pendingSelectionAnchor || null;
    state.railTab = "comments";
    $("selectionBar").hidden = true;
    renderRail();
    if ($("newCmtBody")) $("newCmtBody").focus();
  };
  $("selAskCanon").onclick = () => {
    state.draftAnchor = state._pendingSelectionAnchor || null;
    state.railTab = "comments";
    $("selectionBar").hidden = true;
    renderRail();
    if ($("newCmtRole")) $("newCmtRole").value = "@canon_keeper";
    if ($("newCmtIntent")) $("newCmtIntent").value = "check-canon";
    if ($("newCmtBody")) $("newCmtBody").focus();
  };

  // Global Listeners
  $("bookSwitcherBtn").onclick = (e) => {
    e.stopPropagation();
    state.bookDropdownOpen = !state.bookDropdownOpen;
    renderBookDropdown();
  };
  $("btnModeRich").onclick = () => { state.view = "chapter"; state.editorFormat = "rich"; renderAll(); };
  $("btnModeMd").onclick = () => { state.view = "chapter"; state.editorFormat = "markdown"; renderAll(); };
  $("btnSplitRef").onclick = () => { state.splitRefOpen = !state.splitRefOpen; renderAll(); };
  $("closeSplitBtn").onclick = () => { state.splitRefOpen = false; renderAll(); };
  $("btnCanonHints").onclick = () => { state.canonHints = !state.canonHints; renderAll(); };
  $("btnFocus").onclick = () => { state.focusMode = !state.focusMode; renderChrome(); };
  $("btnTheme").onclick = () => {
    state.themeIdx = (state.themeIdx + 1) % state.themes.length;
    document.documentElement.setAttribute("data-theme", state.themes[state.themeIdx].id);
    renderChrome();
  };
  $("btnSimExternal").onclick = simulateExternalSync;
  $("btnCopyAntigravity").onclick = copyPromptForAntigravity;
  $("syncPill").onclick = () => { state.railTab = "sync"; renderRail(); };

  $("pubCancelBtn").onclick = () => { $("publishModal").hidden = true; };
  $("pubConfirmBtn").onclick = () => {
    const b = currentBook();
    b.publish.epubReady = true;
    b.publish.pdfReady = true;
    b.publish.catalogValidated = true;
    b.publish.isPublic = true;
    b.publish.privacy = "Public GitHub Pages catalog";
    b.publish.lastPublished = "Just now";
    b.githubSync.ahead = 0;
    b.githubSync.lastSynced = "Just now";
    b.syncEvents.unshift({
      id: `SYNC-${b.syncEvents.length + 25}`,
      source: "Publish & Sync",
      time: "Just now",
      summary: `Built catalog via build_catalog.py & pushed authorized release for ${b.title}.`,
      snapshot: "published"
    });
    $("publishModal").hidden = true;
    pulseSync("Published & pushed to GitHub Pages", "external");
    showToast(`Published "${b.title}" to GitHub Pages`);
    renderAll();
  };
  $("publishModal").onclick = (e) => { if (e.target === $("publishModal")) $("publishModal").hidden = true; };

  document.querySelectorAll(".rail-tab").forEach((tab) => {
    tab.onclick = () => { state.railTab = tab.dataset.rail; renderRail(); };
  });

  $("cmdTrigger").onclick = () => {
    $("cmdModal").hidden = false;
    $("cmdInput").value = "";
    state.cmdSelectedIdx = 0;
    renderCmdResults();
    $("cmdInput").focus();
  };
  $("cmdInput").oninput = () => { state.cmdSelectedIdx = 0; renderCmdResults(); };
  $("cmdInput").onkeydown = (e) => {
    const items = getCmdItems($("cmdInput").value);
    if (e.key === "ArrowDown") { e.preventDefault(); state.cmdSelectedIdx = (state.cmdSelectedIdx + 1) % Math.max(1, items.length); renderCmdResults(); }
    if (e.key === "ArrowUp") { e.preventDefault(); state.cmdSelectedIdx = (state.cmdSelectedIdx - 1 + Math.max(1, items.length)) % Math.max(1, items.length); renderCmdResults(); }
    if (e.key === "Enter" && items[state.cmdSelectedIdx]) {
      e.preventDefault();
      $("cmdModal").hidden = true;
      items[state.cmdSelectedIdx].act();
      renderAll();
    }
    if (e.key === "Escape") $("cmdModal").hidden = true;
  };
  $("cmdModal").onclick = (e) => { if (e.target === $("cmdModal")) $("cmdModal").hidden = true; };
  $("versionModal").onclick = (e) => { if (e.target === $("versionModal")) $("versionModal").hidden = true; };

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      $("cmdTrigger").click();
    }
    if (e.key === "Escape") {
      $("cmdModal").hidden = true;
      $("versionModal").hidden = true;
      $("publishModal").hidden = true;
      $("entityPopover").hidden = true;
      state.bookDropdownOpen = false;
      renderBookDropdown();
    }
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".book-switcher-wrap")) {
      state.bookDropdownOpen = false;
      renderBookDropdown();
    }
    if (!e.target.closest(".entity-popover") && !e.target.closest(".canon-hint")) {
      $("entityPopover").hidden = true;
    }
  });

  function renderAll() {
    renderChrome();
    renderLeftNav();
    renderDocToolbar();
    renderCenter();
    renderSplitPane();
    renderRail();
  }

  renderAll();
})();
</script>
</body>
</html>
