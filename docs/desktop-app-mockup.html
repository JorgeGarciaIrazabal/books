<!doctype html>
<html lang="en" data-theme="warm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Studio Desktop — Interactive Writer Workspace Mockup</title>
<style>
:root {
  --bg: #f6f1e7;
  --bg-deep: #ece3d2;
  --sidebar: #f2ebdd;
  --panel: #fffdf7;
  --panel-alt: #faf5ea;
  --ink: #26262b;
  --ink-soft: #4a4a53;
  --muted: #6d6d76;
  --line: #e2d8c5;
  --line-strong: #cfc1a7;
  --accent: #a04a2f;
  --accent-deep: #7f3822;
  --accent-soft: #f2e1d6;
  --gold: #d9a53a;
  --gold-hl: rgba(217, 165, 58, 0.26);
  --gold-hl-active: rgba(217, 165, 58, 0.48);
  --sage: #2d6a4f;
  --sage-bg: rgba(45, 106, 79, 0.14);
  --sage-border: rgba(45, 106, 79, 0.35);
  --writer: #2457a6;
  --writer-bg: rgba(36, 87, 166, 0.12);
  --writer-border: rgba(36, 87, 166, 0.32);
  --rose: #b42318;
  --rose-bg: rgba(180, 35, 24, 0.13);
  --shadow-sm: 0 2px 8px rgba(38, 38, 43, 0.06);
  --shadow-md: 0 12px 32px rgba(38, 38, 43, 0.14);
  --shadow-lg: 0 22px 54px rgba(24, 24, 30, 0.24);
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --radius: 10px;
  --radius-sm: 6px;
}

[data-theme="light"] {
  --bg: #f6f7f9;
  --bg-deep: #ebedf2;
  --sidebar: #f1f3f6;
  --panel: #ffffff;
  --panel-alt: #f8f9fb;
  --ink: #1c1f24;
  --ink-soft: #434954;
  --muted: #68707d;
  --line: #e1e5ec;
  --line-strong: #c9d0dc;
  --accent: #9a3f27;
  --accent-deep: #7a2f1c;
  --accent-soft: #faeae5;
}

[data-theme="dark"] {
  --bg: #141820;
  --bg-deep: #0f1218;
  --sidebar: #181d27;
  --panel: #1d2330;
  --panel-alt: #232a39;
  --ink: #ece6da;
  --ink-soft: #c9c3b8;
  --muted: #939aa6;
  --line: #2b3344;
  --line-strong: #3b465c;
  --accent: #e07b58;
  --accent-deep: #c9623f;
  --accent-soft: rgba(224, 123, 88, 0.16);
  --gold: #eab94f;
  --gold-hl: rgba(234, 185, 79, 0.22);
  --gold-hl-active: rgba(234, 185, 79, 0.44);
  --sage: #5ec291;
  --sage-bg: rgba(94, 194, 145, 0.16);
  --sage-border: rgba(94, 194, 145, 0.35);
  --writer: #6ca4f8;
  --writer-bg: rgba(108, 164, 248, 0.15);
  --writer-border: rgba(108, 164, 248, 0.35);
  --rose: #f2746b;
  --rose-bg: rgba(242, 116, 107, 0.16);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 22px 54px rgba(0, 0, 0, 0.6);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--sans);
  font-size: 13.5px;
  color: var(--ink);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* Topbar */
.topbar {
  height: 46px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  gap: 10px;
  flex-shrink: 0;
  z-index: 30;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: -0.01em;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.brand-mark {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 13px;
}
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.crumb-btn {
  border: none;
  background: transparent;
  color: var(--ink-soft);
  padding: 3px 6px;
  border-radius: 5px;
  font-weight: 500;
}
.crumb-btn:hover { background: var(--bg-deep); color: var(--ink); }
.crumb-current { color: var(--ink); font-weight: 600; }

.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-soft);
  white-space: nowrap;
  transition: all 0.2s ease;
}
.sync-pill.is-saving { border-color: var(--gold); color: var(--ink); }
.sync-pill.is-external { border-color: var(--sage-border); background: var(--sage-bg); color: var(--sage); }
.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--sage);
  box-shadow: 0 0 0 2px var(--sage-bg);
}
.sync-pill.is-saving .sync-dot { background: var(--gold); }

.topbar-center { display: flex; align-items: center; gap: 8px; }
.cmd-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 10px;
  min-width: 205px;
  color: var(--muted);
  font-size: 12px;
  justify-content: space-between;
}
.cmd-trigger:hover { border-color: var(--line-strong); color: var(--ink); }
.kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg-deep);
  border: 1px solid var(--line-strong);
  color: var(--ink-soft);
}

.topbar-right { display: flex; align-items: center; gap: 6px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink-soft);
  padding: 5px 9px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-deep); color: var(--ink); border-color: var(--line-strong); }
.btn.is-active { background: var(--accent-soft); color: var(--accent-deep); border-color: rgba(160, 74, 47, 0.35); }
[data-theme="dark"] .btn.is-active { color: var(--accent); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
.btn-sage {
  background: var(--sage-bg);
  border-color: var(--sage-border);
  color: var(--sage);
  font-weight: 600;
}
.btn-sage:hover { filter: brightness(0.95); }
.btn-sm { padding: 3px 8px; font-size: 11.5px; }
.badge-count {
  background: rgba(255,255,255,0.22);
  padding: 0 5px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}
.btn:not(.btn-primary) .badge-count {
  background: var(--bg-deep);
  color: var(--ink);
}

.seg {
  display: inline-flex;
  background: var(--bg-deep);
  padding: 2px;
  border-radius: 7px;
  border: 1px solid var(--line);
}
.seg button {
  border: none;
  background: transparent;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--muted);
}
.seg button.is-active {
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* Workspace */
.workspace {
  display: flex;
  flex: 1;
  min-height: 0;
  position: relative;
}

/* Left Sidebar */
.sidebar-left {
  width: 268px;
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.2s ease, opacity 0.2s ease;
}
.app.is-focus .sidebar-left,
.app.is-focus .sidebar-right {
  width: 0;
  overflow: hidden;
  border: none;
  opacity: 0;
  pointer-events: none;
}

.book-switcher-wrap {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.book-switcher-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  text-align: left;
}
.book-switcher-btn:hover { border-color: var(--line-strong); }
.book-cover-mini {
  width: 30px;
  height: 40px;
  border-radius: 4px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  box-shadow: var(--shadow-sm);
}
.book-meta { min-width: 0; flex: 1; }
.book-universe-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 600;
}
.book-title-label {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.book-stage-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
  font-size: 11px;
  color: var(--muted);
}
.stage-pill {
  padding: 0 5px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  background: var(--accent-soft);
  color: var(--accent-deep);
}
[data-theme="dark"] .stage-pill { color: var(--accent); }

.book-dropdown {
  position: absolute;
  top: calc(100% - 2px);
  left: 10px;
  right: 10px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  z-index: 50;
  padding: 6px;
}
.book-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px;
  border: none;
  background: transparent;
  border-radius: 7px;
  text-align: left;
}
.book-option:hover, .book-option.is-selected { background: var(--bg); }

.nav-scroll { flex: 1; overflow-y: auto; padding: 10px 8px 14px; }
.nav-group { margin-bottom: 14px; }
.nav-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.nav-add-btn {
  border: none;
  background: transparent;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  text-transform: none;
  letter-spacing: 0;
}
.nav-add-btn:hover { background: var(--accent-soft); }
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 6px 8px;
  border: none;
  background: transparent;
  border-radius: 7px;
  color: var(--ink-soft);
  font-size: 12.5px;
  text-align: left;
  margin-bottom: 1px;
}
.nav-item:hover { background: var(--bg-deep); color: var(--ink); }
.nav-item.is-active {
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.nav-item-main { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
.nav-item-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item-meta { display: flex; align-items: center; gap: 5px; flex-shrink: 0; font-size: 11px; color: var(--muted); }
.dot-indicator { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot-writer { background: var(--writer); }
.dot-agent { background: var(--sage); }
.cmt-pill {
  padding: 0 5px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  background: var(--gold-hl);
  color: var(--ink);
}
.sidebar-footer {
  padding: 8px 12px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Center Stage */
.center-stage {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.doc-toolbar {
  padding: 8px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-alt);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.doc-toolbar-left, .doc-toolbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.version-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}
.version-pill:hover { border-color: var(--accent); }
.baseline-select {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  color: var(--ink-soft);
}
.change-stepper {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 2px 6px;
  font-size: 11.5px;
}
.change-stepper button {
  border: none;
  background: transparent;
  padding: 2px 5px;
  border-radius: 4px;
  color: var(--ink-soft);
  font-weight: 600;
}
.change-stepper button:hover { background: var(--bg-deep); color: var(--ink); }

.center-body { flex: 1; min-height: 0; display: flex; }
.canvas-scroll { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 28px 80px; }

/* Sync Banner */
.sync-banner {
  max-width: 740px;
  margin: 0 auto 16px;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--sage-bg);
  border: 1px solid var(--sage-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.sync-banner-text { font-size: 12.5px; color: var(--ink); }
.sync-banner-text strong { color: var(--sage); }
.sync-banner-actions { display: flex; align-items: center; gap: 6px; }

/* Paper Sheet */
.paper {
  max-width: 740px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  padding: 38px 48px 54px;
}
.paper-wide { max-width: 1160px; padding: 28px 30px 44px; }
.chapter-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.chapter-title-input {
  width: 100%;
  border: none;
  background: transparent;
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--ink);
  padding: 0;
  margin: 0 0 10px;
  outline: none;
}
.chapter-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding-bottom: 18px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}
.file-chip {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg);
  padding: 2px 7px;
  border-radius: 5px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
}

/* Prose */
.prose-body {
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.72;
  color: var(--ink);
}
.prose-block {
  position: relative;
  padding: 4px 10px 4px 14px;
  margin: 0 -10px 14px -14px;
  border-radius: 6px;
  border-left: 3px solid transparent;
  transition: background 0.2s, border-color 0.2s;
}
.prose-block.has-writer-edit { border-left-color: var(--writer); }
.prose-block.has-agent-edit { border-left-color: var(--sage); }
.prose-block.is-flash { background: var(--gold-hl); }
.prose-p { margin: 0; outline: none; }
.prose-p:focus { background: rgba(160, 74, 47, 0.03); }
.block-attribution {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 600;
  margin-bottom: 4px;
  padding: 1px 7px;
  border-radius: 999px;
}
.attr-writer { background: var(--writer-bg); color: var(--writer); }
.attr-agent { background: var(--sage-bg); color: var(--sage); }

.cmt-mark {
  background: var(--gold-hl);
  border-bottom: 2px solid var(--gold);
  border-radius: 2px;
  padding: 0 1px;
  cursor: pointer;
}
.cmt-mark.is-active { background: var(--gold-hl-active); }
.canon-hint { border-bottom: 1.5px dotted var(--accent); cursor: pointer; }
.canon-hint:hover { background: var(--accent-soft); }

/* Diff Styles */
.diff-ins {
  background: var(--sage-bg);
  color: var(--sage);
  border-bottom: 1.5px solid var(--sage);
  padding: 0 2px;
  border-radius: 3px;
}
.diff-ins-writer {
  background: var(--writer-bg);
  color: var(--writer);
  border-bottom: 1.5px solid var(--writer);
  padding: 0 2px;
  border-radius: 3px;
}
.diff-del {
  background: var(--rose-bg);
  color: var(--rose);
  text-decoration: line-through;
  padding: 0 2px;
  border-radius: 3px;
}
.hunk-bar { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-family: var(--sans); }
.hunk-btn {
  border: 1px solid var(--line-strong);
  background: var(--panel);
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
}
.hunk-btn:hover { background: var(--bg-deep); }

/* Side-by-Side */
.sbs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sbs-col {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-alt);
  padding: 16px 18px;
}
.sbs-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 700;
}
.sbs-row {
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 10px;
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.65;
  background: var(--panel);
  border: 1px solid transparent;
}
.sbs-row.is-changed { border-color: var(--line-strong); }

.raw-md-note {
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 14px;
}
.raw-md-pre {
  width: 100%;
  min-height: 480px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  background: var(--bg);
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink);
  resize: vertical;
}

/* Split Reference */
.split-pane {
  width: 340px;
  border-left: 1px solid var(--line);
  background: var(--panel-alt);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.split-pane-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

    selectedCharId: "CHAR-0001",
    editorFormat: "rich",
    diffMode: "clean", // DEFAULT: latest clean version
    baselineVersionId: "v3",
    splitRefOpen: false,
    splitRefKey: "CHAR-0001",
    canonHints: true,
    focusMode: false,
    themeIdx: 0,
    themes: [
      { id: "warm", label: "Warm Paper" },
      { id: "light", label: "Crisp Light" },
      { id: "dark", label: "Evening Ink" }
    ],
    railTab: "comments",
    cmtFilter: "all",
    cmtScope: "all", // all | view
    activeCmtId: null,
    activeChangeIdx: 0,
    bookDropdownOpen: false,
    draftAnchor: null, // { kind, paragraphId, startOffset, endOffset, quote, recordId, recordTitle }
    audioPlaying: false,
    cmdSelectedIdx: 0
  };

  const $ = (id) => document.getElementById(id);
  const currentBook = () => BOOKS[state.bookId];
  const currentChapter = () => {
    const b = currentBook();
    return b.chapters.find((c) => c.id === state.chapterId) || b.chapters[0];
  };

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function countWords(text) {
    const clean = text.trim();
    return clean ? clean.split(/\s+/).length : 0;
  }

  function chapterWordCount(ch) {
    return ch.paragraphs.reduce((acc, p) => acc + countWords(p.text), 0);
  }

  function showToast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { el.hidden = true; }, 3000);
  }

  function pulseSync(label, mode) {
    const pill = $("syncPill");
    const txt = $("syncText");
    pill.classList.remove("is-saving", "is-external");
    if (mode === "saving") pill.classList.add("is-saving");
    if (mode === "external") pill.classList.add("is-external");
    txt.textContent = label;
    pulseSync._busy = true;
    clearTimeout(pulseSync._t);
    pulseSync._t = setTimeout(() => {
      pulseSync._busy = false;
      const b = currentBook();
      if (b && b.githubSync) {
        pill.classList.remove("is-saving", "is-external");
        txt.textContent = `Synced · GitHub ↑${b.githubSync.ahead} ↓${b.githubSync.behind} · ${b.githubSync.lastSynced}`;
      }
    }, 2400);
  }

  // Word-level diff for Inline & Side-by-Side
  function diffWords(oldStr, newStr) {
    if (oldStr === newStr) return [{ type: "same", text: newStr }];
    const a = oldStr.split(/(\s+)/);
    const b = newStr.split(/(\s+)/);
    const n = a.length, m = b.length;
    if (n * m > 35000) return [{ type: "del", text: oldStr }, { type: "ins", text: newStr }];
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? 1 + dp[i + 1][j + 1] : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const out = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { pushDiff(out, "same", a[i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { pushDiff(out, "del", a[i++]); }
      else { pushDiff(out, "ins", b[j++]); }
    }
    while (i < n) pushDiff(out, "del", a[i++]);
    while (j < m) pushDiff(out, "ins", b[j++]);
    return out;
  }

  function pushDiff(arr, type, text) {
    if (!text) return;
    if (arr.length && arr[arr.length - 1].type === type) arr[arr.length - 1].text += text;
    else arr.push({ type, text });
  }

  // Character-level diff projection so external rewrites preserve comment anchors
  function projectRangeThroughDiff(oldText, newText, start, end) {
    if (oldText === newText) return { start, end, quote: newText.slice(start, end), orphaned: false };
    let pre = 0;
    const minLen = Math.min(oldText.length, newText.length);
    while (pre < minLen && oldText[pre] === newText[pre]) pre++;
    let oldEnd = oldText.length, newEnd = newText.length;
    while (oldEnd > pre && newEnd > pre && oldText[oldEnd - 1] === newText[newEnd - 1]) {
      oldEnd--;
      newEnd--;
    }

    const oldMid = oldText.slice(pre, oldEnd);
    const newMid = newText.slice(pre, newEnd);
    const n = oldMid.length, m = newMid.length;

    // Map each index 0..oldText.length -> new index using LCS on the changed middle slice
    const mapIdx = new Int32Array(oldText.length + 1);
    for (let k = 0; k <= pre; k++) mapIdx[k] = k;

    if (n * m <= 90000) {
      const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          dp[i][j] = oldMid[i] === newMid[j] ? 1 + dp[i + 1][j + 1] : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (oldMid[i] === newMid[j]) {
          mapIdx[pre + i] = pre + j;
          i++; j++;
        } else if (dp[i + 1][j] >= dp[i][j + 1]) {
          mapIdx[pre + i] = pre + j;
          i++;
        } else {
          j++;
        }
      }
      while (i <= n) {
        mapIdx[pre + i] = pre + m;
        i++;
      }
    } else {
      for (let i = 0; i <= n; i++) mapIdx[pre + i] = pre + Math.min(m, Math.round((i / Math.max(1, n)) * m));
    }

    const deltaAfter = newText.length - oldText.length;
    for (let k = oldEnd; k <= oldText.length; k++) mapIdx[k] = k + deltaAfter;

    const projStart = Math.max(0, Math.min(newText.length, mapIdx[Math.min(start, oldText.length)]));
    let projEnd = Math.max(projStart, Math.min(newText.length, mapIdx[Math.min(end, oldText.length)]));

    // If start/end sat inside a replaced region, expand to the replacement boundaries
    if (start >= pre && end <= oldEnd && projStart === projEnd && newMid.length > 0) {
      const sWord = Math.max(pre, projStart);
      const eWord = Math.min(newEnd, sWord + Math.max(4, newMid.length));
      projEnd = Math.max(projStart, eWord);
    }

    const quote = newText.slice(projStart, projEnd);
    return { start: projStart, end: projEnd, quote, orphaned: quote.trim().length === 0 };
  }

  // Compute occurrence index of an anchor across the whole chapter (for duplicate-text clarity)
  function getAnchorLocationStats(ch, anchor) {
    const pIdx = ch.paragraphs.findIndex((p) => p.id === anchor.paragraphId);
    const pNum = pIdx >= 0 ? pIdx + 1 : "?";
    const q = anchor.quote;
    if (!q || anchor.orphaned) return { pNum, occ: null, total: 0 };
    let total = 0, occ = 0;
    ch.paragraphs.forEach((p) => {
      let from = 0;
      while (true) {
        const found = p.text.indexOf(q, from);
        if (found === -1) break;
        total++;
        if (p.id === anchor.paragraphId && found === anchor.startOffset) occ = total;
        from = found + Math.max(1, q.length);
      }
    });
    return { pNum, occ: occ || null, total };
  }

  function getBaselineVersion(ch) {
    return ch.versions.find((v) => v.id === state.baselineVersionId) || ch.versions[Math.min(1, ch.versions.length - 1)] || ch.versions[0];
  }

  function getChangesList(ch) {
    const base = getBaselineVersion(ch);
    const baseMap = new Map((base && base.paragraphs ? base.paragraphs : []).map((p) => [p.id, p.text]));
    const list = [];
    ch.paragraphs.forEach((p, idx) => {
      if (p.externalEdit) {
        list.push({ idx, pid: p.id, kind: "agent", label: p.externalEdit.agent });
      } else if (base && base.paragraphs) {
        const oldT = baseMap.get(p.id);
        if (oldT !== undefined && oldT !== p.text) list.push({ idx, pid: p.id, kind: "writer", label: "You" });
        else if (oldT === undefined) list.push({ idx, pid: p.id, kind: "writer", label: "You (new)" });
      }
    });
    return list;
  }

  // Render clean HTML with exact offset-based comment marks + canon hints
  function applyCanonHints(rawText) {
    let html = escapeHtml(rawText);
    if (!state.canonHints) return html;
    const b = currentBook();
    Object.keys(b.entityHints).forEach((term) => {
      const safeTerm = escapeHtml(term);
      const re = new RegExp(`\\b(${safeTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})\\b`, "g");
      html = html.replace(re, `<span class="canon-hint" data-entity="${safeTerm}">$1</span>`);
    });
    return html;
  }

  function renderParagraphSegments(p, ch) {
    const b = currentBook();
    const cmts = b.comments
      .filter((c) => c.chapterId === ch.id && c.status !== "resolved" && !c.anchor.orphaned && c.anchor.paragraphId === p.id)
      .slice()
      .sort((a, z) => a.anchor.startOffset - z.anchor.startOffset);

    if (!cmts.length) return applyCanonHints(p.text);

    let cursor = 0;
    let out = "";
    cmts.forEach((c) => {
      const s = Math.max(cursor, Math.min(p.text.length, c.anchor.startOffset));
      const e = Math.max(s, Math.min(p.text.length, c.anchor.endOffset));
      if (s > cursor) out += applyCanonHints(p.text.slice(cursor, s));
      if (e > s) {
        const cls = state.activeCmtId === c.id ? "cmt-mark is-active" : "cmt-mark";
        out += `<mark class="${cls}" data-cmt-id="${c.id}">${escapeHtml(p.text.slice(s, e))}</mark>`;
      }
      cursor = e;
    });
    if (cursor < p.text.length) out += applyCanonHints(p.text.slice(cursor));
    return out;
  }

  // Extract updated anchor positions from live contenteditable DOM so cursor never resets
  function syncAnchorsFromParagraphDom(pEl, pObj, ch) {
    const b = currentBook();
    const oldText = pObj.text;
    const newText = pEl.innerText.replace(/\n+$/, "");
    pObj.text = newText;

    const pComments = b.comments.filter((c) => c.chapterId === ch.id && c.anchor.paragraphId === pObj.id && c.status !== "resolved");
    if (!pComments.length) return;

    // Walk DOM text offsets to measure exact mark ranges
    const markRanges = new Map();
    let offset = 0;
    function walk(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        offset += node.nodeValue.length;
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        const cmtId = node.dataset ? node.dataset.cmtId : null;
        const start = offset;
        for (let child = node.firstChild; child; child = child.nextSibling) walk(child);
        if (cmtId) markRanges.set(cmtId, { start, end: offset });
      }
    }
    walk(pEl);

    pComments.forEach((c) => {
      const found = markRanges.get(c.id);
      if (found && found.end > found.start) {
        c.anchor.startOffset = found.start;
        c.anchor.endOffset = found.end;
        c.anchor.quote = newText.slice(found.start, found.end);
        c.anchor.prefix = newText.slice(Math.max(0, found.start - 36), found.start);
        c.anchor.suffix = newText.slice(found.end, Math.min(newText.length, found.end + 36));
        c.anchor.orphaned = false;
        c.anchor.autoUpdated = c.anchor.quote !== c.anchor.originalQuote;
      } else {
        // Fallback: project via diff if browser collapsed or removed the <mark> node
        const proj = projectRangeThroughDiff(oldText, newText, c.anchor.startOffset, c.anchor.endOffset);
        c.anchor.startOffset = proj.start;
        c.anchor.endOffset = proj.end;
        c.anchor.quote = proj.quote;
        c.anchor.orphaned = proj.orphaned;
        c.anchor.autoUpdated = true;
      }
    });
  }

  // Render Chrome
  function renderChrome() {
    const b = currentBook();
    const ch = currentChapter();
    const openCmts = b.comments.filter((c) => c.status !== "resolved").length;
    $("topOpenCommentBadge").textContent = openCmts;
    $("railCmtCount").textContent = openCmts;

    $("bookStagePill").textContent = b.stage;
    $("bookStatsLabel").textContent = `${b.chapters.length} ch · ${b.characters.length} chars`;

    const viewNames = {
      chapter: ch ? ch.label : "Manuscript",
      brief: "Book Brief",
      scenes: "Outline & Scene Cards",
      style: "Style & Voice",
      characters: "Characters",
      bible: "World Bible & Glossary",
      canon: "Canon Vault",
      knowledge: "Knowledge & Spoilers",
      gates: "Editorial Gates & Issues",
      exports: "Publish & Audio"
    };

    if (!pulseSync._busy && b.githubSync) {
      $("syncText").textContent = `Synced · GitHub ↑${b.githubSync.ahead} ↓${b.githubSync.behind} · ${b.githubSync.lastSynced}`;
    }

    $("breadcrumbs").innerHTML = `
      <button type="button" class="crumb-btn" id="crumbBookBtn">${escapeHtml(b.universe)}</button>
      <span>›</span>
      <button type="button" class="crumb-btn" id="crumbTitleBtn">${escapeHtml(b.title)}</button>
      <span>›</span>
      <span class="crumb-current">${escapeHtml(viewNames[state.view] || "Workspace")}</span>
    `;
    $("crumbBookBtn").onclick = () => { state.bookDropdownOpen = !state.bookDropdownOpen; renderBookDropdown(); };
    $("crumbTitleBtn").onclick = () => { state.view = "brief"; renderAll(); };

    renderBookDropdown();

    $("btnModeRich").classList.toggle("is-active", state.editorFormat === "rich");
    $("btnModeMd").classList.toggle("is-active", state.editorFormat === "markdown");
    $("btnSplitRef").classList.toggle("is-active", state.splitRefOpen);
    $("btnCanonHints").classList.toggle("is-active", state.canonHints);
    $("btnFocus").classList.toggle("is-active", state.focusMode);
    $("appRoot").classList.toggle("is-focus", state.focusMode);
    $("btnTheme").textContent = state.themes[state.themeIdx].label;
  }

  function renderBookDropdown() {
    const dd = $("bookDropdown");
    dd.hidden = !state.bookDropdownOpen;
    if (dd.hidden) return;
    dd.innerHTML = Object.values(BOOKS).map((b) => `
      <button type="button" class="book-option ${b.id === state.bookId ? "is-selected" : ""}" data-book="${b.id}">
        <div class="book-cover-mini" style="background:${b.color};width:26px;height:34px;font-size:10px;">${b.short}</div>
        <div style="min-width:0;flex:1;">
          <div style="font-size:12px;font-weight:700;">${escapeHtml(b.title)}</div>
          <div style="font-size:11px;color:var(--muted);">${escapeHtml(b.universe)} · ${b.stage}</div>
        </div>
      </button>
    `).join("");
    dd.querySelectorAll("[data-book]").forEach((btn) => {
      btn.onclick = () => {
        state.bookId = btn.dataset.book;
        const nb = currentBook();
        state.chapterId = nb.chapters[0].id;
        state.selectedCharId = nb.characters[0].id;
        state.splitRefKey = nb.characters[0].id;
        state.baselineVersionId = nb.chapters[0].versions[1] ? nb.chapters[0].versions[1].id : nb.chapters[0].versions[0].id;
        state.view = "chapter";
        state.diffMode = "clean";
        state.bookDropdownOpen = false;
        pulseSync("Live Sync · Switched book", "ok");
        renderAll();
      };
    });
  }

  // Left Navigator
  function renderLeftNav() {
    const b = currentBook();
    const openByChap = {};
    b.comments.filter((c) => c.status !== "resolved").forEach((c) => {
      openByChap[c.chapterId] = (openByChap[c.chapterId] || 0) + 1;
    });

    const chapItems = b.chapters.map((ch) => {
      const active = state.view === "chapter" && state.chapterId === ch.id;
      const wc = chapterWordCount(ch);
      const cmts = openByChap[ch.id] || 0;
      const dot = ch.dirtyExternal
        ? '<span class="dot-indicator dot-agent" title="Recent external/Antigravity sync"></span>'
        : ch.dirtyWriter
          ? '<span class="dot-indicator dot-writer" title="Edited since last milestone"></span>'
          : "";
      return `
        <button type="button" class="nav-item ${active ? "is-active" : ""}" data-nav="chapter" data-ch="${ch.id}">
          <span class="nav-item-main">${dot}<span class="nav-item-label">${escapeHtml(ch.label)}</span></span>
          <span class="nav-item-meta">
            <span>${wc}w</span>
            ${cmts ? `<span class="cmt-pill">${cmts}</span>` : ""}
          </span>
        </button>`;
    }).join("");

    const navBtn = (id, label, meta) => `
      <button type="button" class="nav-item ${state.view === id ? "is-active" : ""}" data-nav="${id}">
        <span class="nav-item-main"><span class="nav-item-label">${label}</span></span>
        ${meta ? `<span class="nav-item-meta">${meta}</span>` : ""}
      </button>`;

    const canonCmts = b.comments.filter((c) => c.targetKind === "canon" && c.status !== "resolved").length;
    const canonMeta = canonCmts ? `${b.canon.length} · ${canonCmts} cmt` : `${b.canon.length}`;

    $("leftNav").innerHTML = `
      <div class="nav-group">
        <div class="nav-group-header">
          <span>Manuscript</span>
          <button type="button" class="nav-add-btn" id="addChapterBtn">+ Chapter</button>
        </div>
        ${chapItems}
      </div>
      <div class="nav-group">
        <div class="nav-group-header"><span>Story Craft</span></div>
        ${navBtn("brief", "Book Brief")}
        ${navBtn("scenes", "Outline & Scene Cards", `${b.scenes.length}`)}
        ${navBtn("style", "Style & Voice")}
      </div>
      <div class="nav-group">
        <div class="nav-group-header"><span>World & Lore</span></div>
        ${navBtn("characters", "Characters", `${b.characters.length}`)}
        ${navBtn("bible", "World Bible & Glossary")}
        ${navBtn("canon", "Canon Vault", canonMeta)}
        ${navBtn("knowledge", "Knowledge & Spoilers", `${b.disclosures.length}`)}
      </div>
      <div class="nav-group">
        <div class="nav-group-header"><span>Editorial & Studio</span></div>
        ${navBtn("gates", "Editorial Gates & Issues", `${b.issues.length ? b.issues.length + " open" : "clean"}`)}
        ${navBtn("exports", "Publish & Audio", b.audio && b.audio.enabled ? "audio on" : "")}
      </div>
    `;

    $("leftNav").querySelectorAll("[data-nav]").forEach((btn) => {
      btn.onclick = () => {
        const nav = btn.dataset.nav;
        if (nav === "chapter") {
          state.view = "chapter";
          state.chapterId = btn.dataset.ch;
          const ch = currentChapter();
          state.baselineVersionId = ch.versions[1] ? ch.versions[1].id : ch.versions[0].id;
        } else {
          state.view = nav;
        }
        renderAll();
      };
    });

    $("addChapterBtn").onclick = () => {
      const idx = b.chapters.length + 1;
      const slug = `ch-new-${Date.now()}`;
      const ch = {
        id: slug,
        label: `Ch ${idx}: Untitled Scene`,
        title: `Chapter ${idx}: Untitled Scene`,
        file: `manuscript/00${idx}-untitled-scene.md`,
        pov: b.characters[0].name,
        sceneId: "SC-NEW",
        dirtyWriter: true,
        dirtyExternal: false,
        lastSyncBanner: null,
        paragraphs: [{ id: `${slug}-p1`, text: "Begin writing directly here. Every edit syncs automatically to disk and creates clean Markdown." }],
        versions: [{ id: "v1", num: 1, author: "You", role: "writer", time: "Just now", summary: "Created chapter", delta: "+15 words", paragraphs: null }]
      };
      b.chapters.push(ch);
      state.view = "chapter";
      state.chapterId = slug;
      state.diffMode = "clean";
      state.baselineVersionId = "v1";
      pulseSync("Live Sync · Created & registered in book.json", "ok");
      showToast(`Added ${ch.file}`);
      renderAll();
    };
  }

  // Document Toolbar
  function renderDocToolbar() {
    const bar = $("docToolbar");
    if (state.view !== "chapter") {
      bar.hidden = true;
      return;
    }
    bar.hidden = false;
    const ch = currentChapter();
    const base = getBaselineVersion(ch);
    const changes = getChangesList(ch);

    const versionOpts = ch.versions.map((v) =>
      `<option value="${v.id}" ${base && v.id === base.id ? "selected" : ""}>Compare vs ${v.id} (${escapeHtml(v.author)})</option>`
    ).join("");

    bar.innerHTML = `
      <div class="doc-toolbar-left">
        <button type="button" class="version-pill" id="openHistoryPill" title="Open Version Timeline">
          <span>v${ch.versions[0].num} · Latest</span>
          <span style="color:var(--muted);font-weight:400;">(${ch.versions.length} versions)</span>
        </button>
        <div class="seg" role="group" aria-label="Change visibility mode">
          <button type="button" data-dmode="clean" class="${state.diffMode === "clean" ? "is-active" : ""}">Clean</button>
          <button type="button" data-dmode="inline" class="${state.diffMode === "inline" ? "is-active" : ""}">Inline Diff</button>
          <button type="button" data-dmode="sidebyside" class="${state.diffMode === "sidebyside" ? "is-active" : ""}">Side-by-Side</button>
        </div>
        <select class="baseline-select" id="baselineSelect" aria-label="Baseline version to compare">
          ${versionOpts}
        </select>
      </div>
      <div class="doc-toolbar-right">
        ${changes.length ? `
          <div class="change-stepper">
            <span style="padding:0 4px;font-weight:600;color:var(--ink);">${changes.length} diff${changes.length > 1 ? "s" : ""} vs ${base ? base.id : ""}</span>
            <button type="button" id="prevChangeBtn" title="Previous change">↑</button>
            <button type="button" id="nextChangeBtn" title="Next change">↓</button>
          </div>
        ` : `<span style="font-size:11.5px;color:var(--muted);">Matches ${base ? base.id : "latest"}</span>`}
        <button type="button" class="btn btn-sm" id="saveVersionBtn">+ Save Version</button>
      </div>
    `;

    $("openHistoryPill").onclick = () => { state.railTab = "history"; renderRail(); };
    $("baselineSelect").onchange = (e) => {
      state.baselineVersionId = e.target.value;
      if (state.diffMode === "clean") state.diffMode = "inline";
      renderAll();
    };
    bar.querySelectorAll("[data-dmode]").forEach((b) => {
      b.onclick = () => {
        state.diffMode = b.dataset.dmode;
        state.editorFormat = "rich";
        renderAll();
      };
    });
    if ($("prevChangeBtn")) $("prevChangeBtn").onclick = () => stepChange(-1);
    if ($("nextChangeBtn")) $("nextChangeBtn").onclick = () => stepChange(1);
    $("saveVersionBtn").onclick = openSaveVersionModal;
  }

  function stepChange(dir) {
    const ch = currentChapter();
    const changes = getChangesList(ch);
    if (!changes.length) return;
    if (state.diffMode === "clean") {
      state.diffMode = "inline";
      renderAll();
    }
    state.activeChangeIdx = (state.activeChangeIdx + dir + changes.length) % changes.length;
    const target = changes[state.activeChangeIdx];
    const el = document.querySelector(`[data-pid="${target.pid}"]`);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("is-flash");
      setTimeout(() => el.classList.remove("is-flash"), 900);
    }
  }

  // Render Center Canvas
  function renderCenter() {
    const el = $("centerCanvas");
    if (state.view === "chapter") renderChapterView(el);
    else if (state.view === "characters") renderCharactersView(el);
    else if (state.view === "canon") renderCanonView(el);
    else if (state.view === "scenes") renderScenesView(el);
    else if (state.view === "knowledge") renderKnowledgeView(el);
    else if (state.view === "gates") renderGatesView(el);
    else if (state.view === "brief" || state.view === "style" || state.view === "bible") renderDocInfoView(el);
    else if (state.view === "exports") renderExportsView(el);
  }

  function renderChapterView(container) {
    const b = currentBook();
    const ch = currentChapter();
    const wc = chapterWordCount(ch);

    if (state.editorFormat === "markdown") {
      const mdText = `# ${ch.title}\n\n` + ch.paragraphs.map((p) => p.text).join("\n\n") + "\n";
      container.innerHTML = `
        <div class="paper">
          <div class="chapter-eyebrow">RAW MARKDOWN SOURCE · ${escapeHtml(ch.file)}</div>
          <div class="raw-md-note">
            <strong>Clean Repository Guarantee:</strong> Comments, anchors, and version snapshots live in <code>reviews/comments.json</code> and local history — never inside your <code>.md</code> manuscript or exports.
          </div>
          <textarea class="raw-md-pre" id="rawMdArea">${escapeHtml(mdText)}</textarea>
        </div>`;
      $("rawMdArea").oninput = (e) => {
        const lines = e.target.value.split(/\n\n+/);
        if (lines[0] && lines[0].startsWith("# ")) {
          ch.title = lines[0].slice(2).trim();
          lines.shift();
        }
        ch.paragraphs = lines.filter((x) => x.trim()).map((t, i) => ({
          id: (ch.paragraphs[i] && ch.paragraphs[i].id) || `${ch.id}-p-${i}`,
          text: t.trim()
        }));
        ch.dirtyWriter = true;
        pulseSync("Saving to disk…", "saving");
        clearTimeout(renderChapterView._t);
        renderChapterView._t = setTimeout(() => {
          pulseSync(`Live Sync · Saved ${ch.file}`, "ok");
          renderLeftNav();
        }, 450);
      };
      return;
    }

    const bannerHtml = ch.lastSyncBanner ? `
      <div class="sync-banner">
        <div class="sync-banner-text">${ch.lastSyncBanner}</div>
        <div class="sync-banner-actions">
          <button type="button" class="btn btn-sm btn-sage" id="bannerInlineDiff">Inspect Inline Diff</button>
          <button type="button" class="btn btn-sm" id="bannerSideBySide">Side-by-Side</button>
          <button type="button" class="btn btn-sm" id="bannerDismiss">Dismiss</button>
        </div>
      </div>` : "";

    const base = getBaselineVersion(ch);
    const baseMap = new Map((base && base.paragraphs ? base.paragraphs : []).map((p) => [p.id, p.text]));

    if (state.diffMode === "sidebyside") {
      const leftRows = ch.paragraphs.map((p) => {
        const oldText = baseMap.get(p.id) ?? "(paragraph added later)";
        const changed = oldText !== p.text;
        const tokens = changed && baseMap.has(p.id) ? diffWords(oldText, p.text) : [{ type: "same", text: oldText }];
        const leftHtml = tokens.filter((t) => t.type !== "ins").map((t) =>
          t.type === "del" ? `<span class="diff-del">${escapeHtml(t.text)}</span>` : escapeHtml(t.text)
        ).join("");
        return `<div class="sbs-row ${changed ? "is-changed" : ""}">${leftHtml}</div>`;
      }).join("");

      const rightRows = ch.paragraphs.map((p) => {
        const oldText = baseMap.get(p.id) ?? "";
        const changed = oldText !== p.text;
        const tokens = changed ? diffWords(oldText, p.text) : [{ type: "same", text: p.text }];
        const cls = p.externalEdit ? "diff-ins" : "diff-ins-writer";
        const rightHtml = tokens.filter((t) => t.type !== "del").map((t) =>
          t.type === "ins" ? `<span class="${cls}">${escapeHtml(t.text)}</span>` : escapeHtml(t.text)
        ).join("");
        return `
          <div class="sbs-row ${changed ? "is-changed" : ""}" data-pid="${p.id}">
            ${changed ? `
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-family:var(--sans);">
                <span class="pill ${p.externalEdit ? "pill-sage" : "pill-writer"}">${p.externalEdit ? escapeHtml(p.externalEdit.agent) : "You"}</span>
                ${baseMap.has(p.id) ? `<button type="button" class="hunk-btn" data-restore-p="${p.id}">Restore from ${base.id}</button>` : ""}
              </div>` : ""}
            <div>${rightHtml}</div>
          </div>`;
      }).join("");

      container.innerHTML = `
        ${bannerHtml}
        <div class="paper paper-wide">
          <div class="chapter-eyebrow">${escapeHtml(ch.pov)} · ${escapeHtml(ch.sceneId)} · SIDE-BY-SIDE COMPARE</div>
          <h1 class="chapter-title-input" style="margin-bottom:14px;">${escapeHtml(ch.title)}</h1>
          <div class="sbs-grid">
            <div class="sbs-col">
              <div class="sbs-col-header">
                <span>Baseline: ${base ? `${base.id} (${escapeHtml(base.author)})` : "Original"}</span>
                <span style="color:var(--muted);font-weight:500;">${base ? base.time : ""}</span>
              </div>
              ${leftRows}
            </div>
            <div class="sbs-col">
              <div class="sbs-col-header">
                <span>Latest Version (v${ch.versions[0].num})</span>
                <span style="color:var(--sage);font-weight:600;">${wc} words</span>
              </div>
              ${rightRows}
            </div>
          </div>
        </div>`;

      bindBannerActions(ch);
      container.querySelectorAll("[data-restore-p]").forEach((btn) => {
        btn.onclick = () => {
          const p = ch.paragraphs.find((x) => x.id === btn.dataset.restoreP);
          if (p && baseMap.has(p.id)) {
            p.text = baseMap.get(p.id);
            delete p.externalEdit;
            ch.dirtyWriter = true;
            pulseSync("Live Sync · Restored paragraph from " + base.id, "ok");
            renderAll();
          }
        };
      });
      return;
    }

    // Clean (Default) or Inline Diff mode
    const blocksHtml = ch.paragraphs.map((p) => {
      const oldBaseText = baseMap.get(p.id);
      const changedVsBase = oldBaseText !== undefined && oldBaseText !== p.text;
      const isExt = Boolean(p.externalEdit);

      let blockClass = "prose-block";
      if (isExt) blockClass += " has-agent-edit";
      else if (changedVsBase) blockClass += " has-writer-edit";

      let attrHtml = "";
      let bodyHtml = "";

      if (state.diffMode === "inline" && (isExt || changedVsBase)) {
        const prior = isExt ? p.externalEdit.oldText : oldBaseText;
        const tokens = diffWords(prior, p.text);
        const insCls = isExt ? "diff-ins" : "diff-ins-writer";
        const diffRendered = tokens.map((t) => {
          if (t.type === "del") return `<span class="diff-del">${escapeHtml(t.text)}</span>`;
          if (t.type === "ins") return `<span class="${insCls}">${escapeHtml(t.text)}</span>`;
          return escapeHtml(t.text);
        }).join("");
        attrHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
            <span class="block-attribution ${isExt ? "attr-agent" : "attr-writer"}">
              ${isExt ? escapeHtml(p.externalEdit.agent) + " · synced from disk" : "You · edited vs " + base.id}
            </span>
            <span class="hunk-bar">
              <button type="button" class="hunk-btn" data-revert-p="${p.id}">Revert to ${isExt ? "pre-sync" : base.id}</button>
            </span>
          </div>`;
        bodyHtml = `<p class="prose-p" contenteditable="true" data-edit-pid="${p.id}">${diffRendered}</p>`;
      } else {
        bodyHtml = `<p class="prose-p" contenteditable="true" data-edit-pid="${p.id}">${renderParagraphSegments(p, ch)}</p>`;
      }

      return `<div class="${blockClass}" data-pid="${p.id}">${attrHtml}${bodyHtml}</div>`;
    }).join("");

    container.innerHTML = `
      ${bannerHtml}
      <article class="paper">
        <div class="chapter-eyebrow">${escapeHtml(b.series)} · POV: ${escapeHtml(ch.pov)} · ${escapeHtml(ch.sceneId)}</div>
        <input type="text" class="chapter-title-input" id="chTitleInput" value="${escapeHtml(ch.title)}" aria-label="Chapter Title">
        <div class="chapter-meta-row">
          <span><strong id="liveWordCount">${wc}</strong> words · Latest version (Clean) · Direct WYSIWYG editing</span>
          <span class="file-chip">${escapeHtml(ch.file)}</span>
        </div>
        <div class="prose-body" id="proseBody">
          ${blocksHtml}
        </div>
      </article>`;

    bindBannerActions(ch);

    $("chTitleInput").oninput = (e) => {
      ch.title = e.target.value;
      ch.dirtyWriter = true;
      pulseSync("Saving title…", "saving");
      clearTimeout(renderChapterView._titleTimer);
      renderChapterView._titleTimer = setTimeout(() => {
        pulseSync(`Live Sync · Saved ${ch.file}`, "ok");
      }, 450);
    };

    // Live WYSIWYG editing with automatic anchor preservation (caret never jumps!)
    container.querySelectorAll("[data-edit-pid]").forEach((pEl) => {
      pEl.addEventListener("input", () => {
        const pid = pEl.dataset.editPid;
        const pObj = ch.paragraphs.find((x) => x.id === pid);
        if (!pObj) return;
        syncAnchorsFromParagraphDom(pEl, pObj, ch);
        ch.dirtyWriter = true;
        const wcEl = $("liveWordCount");
        if (wcEl) wcEl.textContent = chapterWordCount(ch);
        pulseSync("Saving prose + updating anchors…", "saving");
        clearTimeout(renderChapterView._saveTimer);
        renderChapterView._saveTimer = setTimeout(() => {
          pulseSync(`Live Sync · Saved ${ch.file} & comments.json`, "ok");
          renderLeftNav();
          renderDocToolbar();
          if (state.railTab === "comments") renderRail();
        }, 350);
      });
    });

    container.querySelectorAll("[data-revert-p]").forEach((btn) => {
      btn.onclick = () => {
        const p = ch.paragraphs.find((x) => x.id === btn.dataset.revertP);
        if (!p) return;
        if (p.externalEdit) {
          p.text = p.externalEdit.oldText;
          delete p.externalEdit;
        } else if (baseMap.has(p.id)) {
          p.text = baseMap.get(p.id);
        }
        pulseSync("Live Sync · Reverted paragraph", "ok");
        renderAll();
      };
    });

    container.querySelectorAll("[data-cmt-id]").forEach((mark) => {
      mark.onclick = (e) => {
        e.stopPropagation();
        state.activeCmtId = mark.dataset.cmtId;
        state.railTab = "comments";
        renderRail();
      };
    });

    container.querySelectorAll("[data-entity]").forEach((span) => {
      span.onclick = (e) => {
        e.stopPropagation();
        const info = b.entityHints[span.dataset.entity];
        if (!info) return;
        const rect = span.getBoundingClientRect();
        const pop = $("entityPopover");
        pop.innerHTML = `
          <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--accent);margin-bottom:4px;">${escapeHtml(info.type)}</div>
          <div style="font-weight:700;font-size:14px;margin-bottom:5px;">${escapeHtml(span.dataset.entity)}</div>
          <p style="margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.45;">${escapeHtml(info.blurb)}</p>
          <div style="display:flex;gap:6px;">
            <button type="button" class="btn btn-sm btn-primary" id="popOpenFull">Open Record</button>
            <button type="button" class="btn btn-sm" id="popPinSplit">Pin in Split Ref</button>
          </div>`;
        pop.style.left = Math.min(window.innerWidth - 320, rect.left) + "px";
        pop.style.top = (rect.bottom + 8) + "px";
        pop.hidden = false;
        $("popOpenFull").onclick = () => {
          pop.hidden = true;
          state.view = info.targetView;
          if (info.targetView === "characters") state.selectedCharId = info.targetId;
          renderAll();
        };
        $("popPinSplit").onclick = () => {
          pop.hidden = true;
          state.splitRefOpen = true;
          state.splitRefKey = info.targetId;
          renderAll();
        };
      };
    });
  }

  function bindBannerActions(ch) {
    if ($("bannerInlineDiff")) $("bannerInlineDiff").onclick = () => { state.diffMode = "inline"; renderAll(); };
    if ($("bannerSideBySide")) $("bannerSideBySide").onclick = () => { state.diffMode = "sidebyside"; renderAll(); };
    if ($("bannerDismiss")) $("bannerDismiss").onclick = () => { ch.lastSyncBanner = null; renderCenter(); };
  }

  // Characters View
  function renderCharactersView(container) {
    const b = currentBook();
    const sel = b.characters.find((c) => c.id === state.selectedCharId) || b.characters[0];
    const cards = b.characters.map((c) => `
      <div class="card char-card ${c.id === sel.id ? "is-highlighted" : ""}" data-char="${c.id}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <strong style="font-size:14px;">${escapeHtml(c.name)}</strong>
          <span class="pill ${c.status === "accepted" ? "pill-sage" : "pill-gold"}">${c.status}</span>
        </div>
        <div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px;">${escapeHtml(c.title)}</div>
        <div style="font-size:12px;color:var(--muted);">${escapeHtml(c.role.slice(0, 96))}…</div>
      </div>`).join("");

    const relHtml = sel.relations.map((rid) => {
      const target = b.characters.find((x) => x.id === rid);
      return target ? `<button type="button" class="rel-pill" data-jump-char="${target.id}">${escapeHtml(target.name)} (${target.id}) →</button>` : "";
    }).join("");

    container.innerHTML = `
      <div class="paper paper-wide">
        <div class="view-header">
          <div>
            <div class="chapter-eyebrow">WORLD & LORE · CHARACTER SHEETS</div>
            <h1 class="view-title">Cast & Voice Profiles</h1>
          </div>
          <span class="file-chip">${escapeHtml(sel.file)}</span>
        </div>
        <div class="grid-2" style="margin-bottom:20px;">${cards}</div>
        <div class="card" style="padding:18px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
            <div>
              <span class="pill">${sel.id}</span>
              <h2 style="margin:6px 0 2px;font-family:var(--serif);">${escapeHtml(sel.name)} — ${escapeHtml(sel.title)}</h2>
            </div>
            <button type="button" class="btn btn-sm btn-primary" id="cmtCharBtn">+ Comment for @character_director</button>
          </div>
          <div class="field-label">Role & Agency (Editable — syncs to character file)</div>
          <textarea class="editable-box" rows="2" id="charRoleEdit">${escapeHtml(sel.role)}</textarea>
          <div class="field-label">Desire / Want</div>
          <textarea class="editable-box" rows="2" id="charWantEdit">${escapeHtml(sel.want)}</textarea>
          <div class="field-label">Limits & Canon Constraints</div>
          <div class="editable-box">${escapeHtml(sel.limits)}</div>
          <div class="field-label">Voice & Sample Line</div>
          <div class="editable-box"><strong>Tone:</strong> ${escapeHtml(sel.voice)}<br><em>${escapeHtml(sel.sampleLine)}</em></div>
          <div class="field-label">Connected Characters</div>
          <div>${relHtml || "<span style='color:var(--muted)'>None linked yet</span>"}</div>
        </div>
      </div>`;

    container.querySelectorAll("[data-char]").forEach((el) => {
      el.onclick = () => { state.selectedCharId = el.dataset.char; renderAll(); };
    });
    container.querySelectorAll("[data-jump-char]").forEach((el) => {
      el.onclick = () => { state.selectedCharId = el.dataset.jumpChar; renderAll(); };
    });
    $("charRoleEdit").oninput = (e) => { sel.role = e.target.value; pulseSync(`Live Sync · Saved ${sel.file}`, "ok"); };
    $("charWantEdit").oninput = (e) => { sel.want = e.target.value; pulseSync(`Live Sync · Saved ${sel.file}`, "ok"); };
    $("cmtCharBtn").onclick = () => {
      state.railTab = "comments";
      state.draftAnchor = { paragraphId: null, startOffset: 0, endOffset: 0, quote: `${sel.name}: ${sel.sampleLine}`, orphaned: false };
      renderRail();
      showToast("Prepared comment for Antigravity (@character_director)");
    };
  }

  // Canon Vault View (with direct commenting on canon items)
  function renderCanonView(container) {
    const b = currentBook();
    const activeCmt = b.comments.find((c) => c.id === state.activeCmtId);
    const cards = b.canon.map((f) => {
      const openCount = b.comments.filter((c) => c.targetKind === "canon" && c.recordId === f.id && c.status !== "resolved").length;
      const isActive = activeCmt && activeCmt.targetKind === "canon" && activeCmt.recordId === f.id;
      return `
      <div class="card ${isActive ? "is-highlighted" : ""}" data-canon-card="${f.id}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap;">
          <div>
            <span class="pill">${f.id}</span>
            <strong style="margin-left:6px;">${escapeHtml(f.title)}</strong>
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            ${openCount ? `<span class="cmt-pill">${openCount} comment${openCount > 1 ? "s" : ""}</span>` : ""}
            <span class="pill ${f.status === "accepted" ? "pill-sage" : "pill-gold"}">${f.status}</span>
            <button type="button" class="btn btn-sm" data-comment-canon="${f.id}">+ Comment</button>
            ${f.status === "proposed" ? `<button type="button" class="btn btn-sm btn-sage" data-accept-canon="${f.id}">Accept into Canon</button>` : ""}
          </div>
        </div>
        <p style="margin:0;color:var(--ink-soft);line-height:1.5;">${escapeHtml(f.text)}</p>
      </div>`;
    }).join("");

    container.innerHTML = `
      <div class="paper paper-wide">
        <div class="view-header">
          <div>
            <div class="chapter-eyebrow">UNIVERSE LEDGER · CANON &amp; PROPOSALS</div>
            <h1 class="view-title">Canon Vault (${b.canon.length} rules)</h1>
          </div>
          <span class="file-chip">${b.id}/canon.json + canon/proposals.json</span>
        </div>
        ${cards}
      </div>`;

    container.querySelectorAll("[data-comment-canon]").forEach((btn) => {
      btn.onclick = () => {
        const fact = b.canon.find((x) => x.id === btn.dataset.commentCanon);
        if (!fact) return;
        state.railTab = "comments";
        state.draftAnchor = {
          kind: "canon",
          recordId: fact.id,
          recordTitle: fact.title,
          quote: fact.text.slice(0, 90)
        };
        renderRail();
        if ($("newCmtRole")) $("newCmtRole").value = "@canon_keeper";
        if ($("newCmtIntent")) $("newCmtIntent").value = "check-canon";
        if ($("newCmtBody")) $("newCmtBody").focus();
        showToast(`Ready to comment on ${fact.id}: ${fact.title}`);
      };
    });

    container.querySelectorAll("[data-accept-canon]").forEach((btn) => {
      btn.onclick = () => {
        const fact = b.canon.find((x) => x.id === btn.dataset.acceptCanon);
        if (fact) {
          fact.status = "accepted";
          b.githubSync.ahead += 1;
          pulseSync("Live Sync · Promoted to canon.json (rev +1)", "ok");
          showToast(`${fact.id} accepted into canon.json`);
          renderAll();
        }
      };
    });
  }

  // Editorial Gates & Issues View
  function renderGatesView(container) {
    const b = currentBook();
    const gatesHtml = b.gates.map((g) => {
      const cls = g.status === "pass" ? "pill-sage" : g.status === "revise" ? "pill-rose" : "pill-gold";
      return `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
            <strong>${escapeHtml(g.name)}</strong>
            <span class="pill ${cls}">${g.status}</span>
          </div>
          <div style="font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:4px;">@${escapeHtml(g.owner)}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);">${escapeHtml(g.note)}</div>
        </div>`;
    }).join("");

    const issuesHtml = b.issues.length ? b.issues.map((iss) => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">

          ${aud.enabled ? `
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
              <span class="pill pill-sage">drama3.py doctor: OK</span>
              <span class="pill">audiocpp_cli (Vulkan)</span>
              <span class="pill">ffmpeg</span>
              <span class="pill">faster-whisper ASR</span>

            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">

    $("runBuildBtn").onclick = () => {

      renderChrome();

      showToast("build_catalog.py validate: 0 errors, 0 comment/narration tags in exports");
      renderExportsView(container);

      $("publishModalDesc").textContent = pub.isPublic
        ? `Update the public GitHub Pages catalog edition for "${b.title}" and push via tools/studio_sync.py.`

      $("publishModalChecks").innerHTML = `
        • <code>studio.py check</code>: <strong>0 errors</strong><br>
        • EPUB &amp; PDF built: <strong>${pub.epubReady ? "Yes" : "Will build on publish"}</strong><br>
        • Zero comment/narration tags in EPUB/PDF: <strong>Verified</strong>`;
      $("publishAudioCheck").checked = aud.enabled && aud.step === "verified";
      $("publishModal").hidden = false;
    };
    $("toggleAudioEnabled").onchange = (e) => {
      aud.enabled = e.target.checked;
      state.audioPlaying = false;
      renderAll();
    };
    container.querySelectorAll("[data-audio-step]").forEach((btn) => {
      btn.onclick = () => {
        aud.step = btn.dataset.audioStep;
        if (aud.step === "verified") aud.duration = `${b.chapters.length * 11}m (${b.chapters.length} chapters)`;
        showToast(`Ran ${btn.title}`);
        renderExportsView(container);
      };
    });
    if ($("previewAudioBtn")) {
      $("previewAudioBtn").onclick = () => {
        state.audioPlaying = !state.audioPlaying;
        showToast(state.audioPlaying ? "Playing Drama 3 sample preview…" : "Paused sample preview");
        renderExportsView(container);
